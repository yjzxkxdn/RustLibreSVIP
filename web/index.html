<style>
  :root {
    --indigo: #3f51b5;
    --indigo-dark: #303f9f;
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e0e0e0;
    --text: #212121;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  header {
    background: var(--indigo);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header span { font-size: 12px; opacity: .8; }
  main { max-width: 880px; margin: 24px auto; padding: 0 16px 48px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .field { flex: 1 1 240px; display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12px; color: var(--muted); }
  select, input[type=file], input[type=text], input[type=number] {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
  }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--indigo);
    border: 0;
    border-radius: 4px;
    padding: 10px 22px;
    cursor: pointer;
  }
  button:disabled { background: #b0b0b0; cursor: default; }
  button:hover:not(:disabled) { background: var(--indigo-dark); }
  button.ghost {
    background: transparent;
    color: var(--indigo);
    border: 1px solid var(--border);
    padding: 4px 10px;
    font-size: 12px;
  }
  #drop {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 26px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
  }
  #drop.over { border-color: var(--indigo); background: #f3f5ff; }
  #drop strong { color: var(--text); }
  #file-list { list-style: none; margin: 12px 0 0; padding: 0; }
  #file-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  #file-list li .name { flex: 1; overflow-wrap: anywhere; }
  #file-list li .format { color: var(--muted); font-size: 12px; }
  #options-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 8px; }
  #options-grid .option { display: flex; flex-direction: column; gap: 4px; }
  #options-grid .option .title { font-size: 12px; color: var(--muted); }
  #options-grid .option .title code { color: var(--text); }
  #status { white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12px; }
  #status.error { color: #c62828; }
  #status.ok { color: #2e7d32; }
  .hint { font-size: 12px; color: var(--muted); }
  a.download { display: block; margin-top: 4px; color: var(--indigo); font-weight: 600; }
  footer { text-align: center; font-size: 12px; color: var(--muted); }
  details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>RustLibreSVIP 网页转换器</h1>
  <span>Rust → WebAssembly 演示 · 40 种工程格式 · 全部在本机浏览器里完成</span>
</header>

<main>
  <div class="card">
    <div class="row">
      <div class="field">
        <label for="file">输入文件（可多选）</label>
        <input id="file" type="file" multiple>
      </div>
      <div class="field">
        <label for="input-format">输入格式</label>
        <select id="input-format"></select>
      </div>
      <div class="field">
        <label for="output-format">输出格式</label>
        <select id="output-format"></select>
      </div>
    </div>
    <p class="hint">也可以把文件拖进下面的区域（支持一次多个）。所有转换都在本地完成，文件不会上传。</p>
    <div id="drop"><span id="drop-label">把工程文件拖到这里，或点击<strong>选择文件</strong></span><input id="drop-input" type="file" hidden multiple></div>
    <ul id="file-list"></ul>
  </div>

  <div class="card">
    <details id="options-panel">
      <summary>转换选项（默认隐藏，展开后按所选格式显示）</summary>
      <div id="options-grid"></div>
    </details>
  </div>

  <div class="card">
    <button id="run" disabled>开始转换</button>
    <p id="status" class="hint">正在加载 WebAssembly 模块…</p>
  </div>

  <footer id="build"></footer>
</main>

<script>
"use strict";

const state = { api: null, files: [], formats: [], schemas: null };

const $ = (selector) => document.querySelector(selector);

function formatBytes(size) {
  if (size < 1024) return `${size} B`;
  if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KiB`;
  return `${(size / 1024 / 1024).toFixed(2)} MiB`;
}

function setStatus(text, kind) {
  const node = $("#status");
  node.textContent = text;
  node.className = kind ? `hint ${kind}` : "hint";
}

function writeString(api, text) {
  const bytes = new TextEncoder().encode(text);
  const pointer = api.alloc(bytes.length);
  new Uint8Array(api.memory.buffer, pointer, bytes.length).set(bytes);
  return { pointer, length: bytes.length };
}

function readResult(api) {
  const pointer = api.result_ptr();
  const length = api.result_len();
  return new Uint8Array(api.memory.buffer, pointer, length).slice();
}

function extensionFor(id) {
  const format = state.formats.find((item) => item.id === id);
  return format && format.suffixes.length ? format.suffixes[0] : id;
}

function detectFormat(name) {
  const suffix = name.includes(".") ? name.split(".").pop().toLowerCase() : "";
  const matches = state.formats.filter((item) => item.suffixes.includes(suffix));
  return matches.length ? matches[0].id : null;
}

function fillSelect(select, selected) {
  select.innerHTML = "";
  for (const format of state.formats) {
    const option = document.createElement("option");
    option.value = format.id;
    option.textContent = `${format.name}（.${format.suffixes.join(" .") || format.id}）`;
    if (format.id === selected) option.selected = true;
    select.append(option);
  }
}

function renderFileList() {
  const list = $("#file-list");
  list.innerHTML = "";
  state.files.forEach((file, index) => {
    const item = document.createElement("li");
    const detected = detectFormat(file.name);
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = `${file.name} · ${formatBytes(file.size)}`;
    const format = document.createElement("span");
    format.className = "format";
    format.textContent = detected ? `.${detected}` : "未识别后缀";
    const remove = document.createElement("button");
    remove.className = "ghost";
    remove.textContent = "移除";
    remove.addEventListener("click", () => {
      state.files.splice(index, 1);
      renderFileList();
      $("#run").disabled = !state.api || state.files.length === 0;
    });
    item.append(name, format, remove);
    list.append(item);
  });
  $("#run").disabled = !state.api || state.files.length === 0;
}

function addFiles(fileList) {
  for (const file of fileList) state.files.push(file);
  if (state.files.length) {
    const detected = detectFormat(state.files[state.files.length - 1].name);
    if (detected) $("#input-format").value = detected;
  }
  $("#drop-label").innerHTML = state.files.length
    ? `<strong>${state.files.length} 个文件</strong>（继续拖放可追加）`
    : "把工程文件拖到这里，或点击<strong>选择文件</strong>";
  renderFileList();
  refreshOptions();
}

async function refreshOptions() {
  const api = state.api;
  if (!api) return;
  const inputFormat = $("#input-format").value;
  const outputFormat = $("#output-format").value;
  const inName = writeString(api, inputFormat);
  const outName = writeString(api, outputFormat);
  const status = api.options_json(inName.pointer, inName.length, outName.pointer, outName.length);
  if (inName.length) api.dealloc(inName.pointer, inName.length);
  if (outName.length) api.dealloc(outName.pointer, outName.length);
  if (status !== 0) {
    state.schemas = null;
    return;
  }
  state.schemas = JSON.parse(new TextDecoder().decode(readResult(api)));
  renderOptions();
}

function optionControl(field) {
  if (field.kind === "bool") {
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = field.default === "True" || field.default === "true" || field.default === "1";
    input.dataset.key = field.key;
    input.dataset.kind = "bool";
    return input;
  }
  if (field.kind === "enum" && field.choices.length) {
    const select = document.createElement("select");
    select.dataset.key = field.key;
    select.dataset.kind = "str";
    for (const choice of field.choices) {
      const option = document.createElement("option");
      option.value = choice.value;
      option.textContent = choice.title || choice.value;
      if (field.default === choice.value) option.selected = true;
      select.append(option);
    }
    return select;
  }
  const input = document.createElement("input");
  input.dataset.key = field.key;
  if (field.kind === "int") {
    input.type = "number";
    input.step = "1";
    input.dataset.kind = "int";
  } else if (field.kind === "float") {
    input.type = "number";
    input.step = "any";
    input.dataset.kind = "float";
  } else {
    input.type = "text";
    input.dataset.kind = "str";
  }
  input.value = field.default === "None" ? "" : field.default;
  return input;
}

function renderOptions() {
  const grid = $("#options-grid");
  grid.innerHTML = "";
  if (!state.schemas) return;
  for (const [heading, fields] of [["输入选项", state.schemas.input], ["输出选项", state.schemas.output]]) {
    if (!fields.length) continue;
    const group = document.createElement("div");
    group.className = "option";
    const title = document.createElement("div");
    title.className = "title";
    title.innerHTML = `<strong>${heading}</strong>`;
    group.append(title);
    grid.append(group);
    for (const field of fields) {
      const wrap = document.createElement("div");
      wrap.className = "option";
      const label = document.createElement("label");
      const name = document.createElement("code");
      name.textContent = field.title || field.key;
      label.append(name);
      if (field.description) label.title = field.description;
      const control = optionControl(field);
      control.dataset.side = heading === "输入选项" ? "input" : "output";
      wrap.append(label, control);
      grid.append(wrap);
    }
  }
}

function collectOptions() {
  const result = { input: {}, output: {} };
  for (const control of document.querySelectorAll("#options-grid [data-key]")) {
    const side = control.dataset.side;
    let value;
    if (control.dataset.kind === "bool") {
      value = control.checked;
    } else if (control.dataset.kind === "int") {
      if (control.value === "") continue;
      value = Number.parseInt(control.value, 10);
    } else if (control.dataset.kind === "float") {
      if (control.value === "") continue;
      value = Number.parseFloat(control.value);
    } else {
      if (control.value === "") continue;
      value = control.value;
    }
    result[side][control.dataset.key] = value;
  }
  return result;
}

async function convert() {
  const api = state.api;
  if (!api || !state.files.length) return;
  $("#run").disabled = true;
  const inputFormat = $("#input-format").value;
  const outputFormat = $("#output-format").value;
  const options = collectOptions();

  try {
    const inName = writeString(api, inputFormat);
    const outName = writeString(api, outputFormat);
    const inOptions = writeString(api, JSON.stringify(options.input));
    const outOptions = writeString(api, JSON.stringify(options.output));
    const results = [];
    for (let index = 0; index < state.files.length; index += 1) {
      const file = state.files[index];
      setStatus(`转换中 ${index + 1}/${state.files.length}：${file.name}（${inputFormat} → ${outputFormat}）…`);
      const input = new Uint8Array(await file.arrayBuffer());
      const inputPointer = api.alloc(input.length);
      new Uint8Array(api.memory.buffer, inputPointer, input.length).set(input);
      const started = performance.now();
      const status = api.convert_with_options(
        inputPointer, input.length,
        inName.pointer, inName.length,
        outName.pointer, outName.length,
        inOptions.pointer, inOptions.length,
        outOptions.pointer, outOptions.length,
      );
      const elapsed = performance.now() - started;
      const payload = readResult(api);
      const warnings = api.warnings_json
        ? new TextDecoder().decode(readResult(api))
        : "[]";
      if (input.length) api.dealloc(inputPointer, input.length);
      if (status !== 0) {
        results.push({ file: file.name, error: new TextDecoder().decode(payload) });
      } else {
        results.push({ file: file.name, payload, elapsed, warnings });
      }
    }
    for (const [pointer, length] of [
      [inName.pointer, inName.length],
      [outName.pointer, outName.length],
      [inOptions.pointer, inOptions.length],
      [outOptions.pointer, outOptions.length],
    ]) {
      if (length > 0) api.dealloc(pointer, length);
    }

    $("#status").className = "hint";
    $("#status").textContent = "";
    const failures = results.filter((item) => item.error);
    for (const item of results) {
      if (item.error) continue;
      const outputName = `${item.file.replace(/\.[^.]+$/, "")}.${extensionFor(outputFormat)}`;
      const blob = new Blob([item.payload], { type: "application/octet-stream" });
      const link = document.createElement("a");
      link.className = "download";
      link.href = URL.createObjectURL(blob);
      link.download = outputName;
      const warningCount = JSON.parse(item.warnings).length;
      link.textContent =
        `下载 ${outputName}（${formatBytes(item.payload.length)}，${item.elapsed.toFixed(0)} ms` +
        (warningCount ? `，${warningCount} 条警告` : "") + "）";
      $("#status").append(link);
    }
    if (failures.length) {
      const summary = document.createElement("div");
      summary.style.color = "#c62828";
      summary.textContent = failures.map((item) => `${item.file}: ${item.error}`).join("\n");
      $("#status").append(summary);
      setStatus(`完成：${results.length - failures.length} 成功 / ${failures.length} 失败`, failures.length ? "error" : "ok");
    } else {
      setStatus(`完成：${results.length} 个文件全部转换成功`, "ok");
    }
  } catch (error) {
    setStatus(`出错：${error && error.message ? error.message : error}`, "error");
  } finally {
    $("#run").disabled = false;
  }
}

async function boot(wasmBytes) {
  const started = performance.now();
  const { instance } = await WebAssembly.instantiate(wasmBytes, {});
  const api = instance.exports;
  state.api = api;

  api.formats_json();
  state.formats = JSON.parse(new TextDecoder().decode(readResult(api)))
    .sort((left, right) => left.name.localeCompare(right.name));

  fillSelect($("#input-format"), "ustx");
  fillSelect($("#output-format"), "acep");
  $("#build").textContent =
    `${state.formats.length} 个格式 · wasm ${formatBytes(wasmBytes.length)} · 实例化 ${(performance.now() - started).toFixed(0)} ms`;
  setStatus("模块已加载，选择工程文件即可开始（支持一次多个；文件不会离开这台电脑）。");
  $("#run").disabled = state.files.length === 0;
  refreshOptions();
}

function wire() {
  $("#file").addEventListener("change", (event) => {
    if (event.target.files.length) addFiles(event.target.files);
  });
  $("#drop").addEventListener("click", () => $("#drop-input").click());
  $("#drop-input").addEventListener("change", (event) => {
    if (event.target.files.length) addFiles(event.target.files);
  });
  $("#drop").addEventListener("dragover", (event) => {
    event.preventDefault();
    $("#drop").classList.add("over");
  });
  $("#drop").addEventListener("dragleave", () => $("#drop").classList.remove("over"));
  $("#drop").addEventListener("drop", (event) => {
    event.preventDefault();
    $("#drop").classList.remove("over");
    if (event.dataTransfer.files.length) addFiles(event.dataTransfer.files);
  });
  $("#run").addEventListener("click", convert);
  $("#input-format").addEventListener("change", refreshOptions);
  $("#output-format").addEventListener("change", refreshOptions);
}

function base64ToBytes(text) {
  const binary = atob(text);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
  return bytes;
}

async function loadWasm() {
  // Single-file build: the module is inlined, gzip-compressed + base64.
  if (window.__LIBRESVIP_WASM_GZIP_BASE64__) {
    if (typeof DecompressionStream !== "function") {
      throw new Error("这个浏览器不支持 DecompressionStream，请改用随附的 index.html 版本");
    }
    const compressed = base64ToBytes(window.__LIBRESVIP_WASM_GZIP_BASE64__);
    const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  if (window.__LIBRESVIP_WASM_BASE64__) {
    return base64ToBytes(window.__LIBRESVIP_WASM_BASE64__);
  }
  const response = await fetch("libresvip_web.wasm");
  if (!response.ok) throw new Error(`libresvip_web.wasm: HTTP ${response.status}`);
  return new Uint8Array(await response.arrayBuffer());
}

wire();
loadWasm()
  .then(boot)
  .catch((error) => setStatus(`无法加载 WebAssembly 模块：${error.message}`, "error"));
</script>
</body>
</html>
