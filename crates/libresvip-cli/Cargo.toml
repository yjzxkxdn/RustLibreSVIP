[package]
name = "libresvip-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line interface for LibreSVIP (Rust port)"

[[bin]]
name = "libresvip-cli"
path = "src/main.rs"

[features]
default = ["rpc"]
# `rpc server` pulls in tonic/tokio/prost and a 1 MiB icon table; build with
# `--no-default-features` for a lean binary.
rpc = [
    "dep:tonic",
    "dep:prost",
    "dep:tokio",
    "dep:http-body-util",
    "dep:bytes",
]

[dependencies]
libresvip-core = { workspace = true }
libresvip-plugins = { workspace = true }
libresvip-middlewares = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "cargo"] }
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
