[package]
name = "libresvip-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line interface for LibreSVIP (Rust port)"

[[bin]]
name = "libresvip-cli"
path = "src/main.rs"

[dependencies]
libresvip-core = { workspace = true }
libresvip-plugins = { workspace = true }
libresvip-middlewares = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "cargo"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std"] }
http-body-util = "0.1"
bytes = "1"
