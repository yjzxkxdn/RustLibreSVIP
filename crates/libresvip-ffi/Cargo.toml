[package]
name = "libresvip-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI for the LibreSVIP conversion engine (C, C++, Python, anything with dlopen)"

[lib]
# The exported artifact is `libresvip.dll` / `liblibresvip.so` on purpose: that
# is the name every binding looks for. It is also why `doctest` is off - rustdoc
# would pass two crates named `libresvip` (this one and the facade it wraps) to
# the same compile, which rustc rejects as ambiguous.
name = "libresvip"
crate-type = ["cdylib", "staticlib", "rlib"]
doctest = false

[dependencies]
libresvip = { workspace = true }
