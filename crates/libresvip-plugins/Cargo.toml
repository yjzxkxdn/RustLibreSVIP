[package]
name = "libresvip-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Format conversion plugins for LibreSVIP (Rust port)"

[dependencies]
libresvip-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
encoding_rs = { workspace = true }
base64 = { workspace = true }
quick-xml = { workspace = true }
# `default-features = false` keeps rayon out (it is only used by midly's
# optional `parallel` feature and does not build for wasm32).
midly = { version = "0.5", default-features = false, features = ["std"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ciborium = "0.2"
prost = "0.13"
roxmltree = "0.20"
byteorder = "1"
crc32fast = "1"
unicode-normalization = "0.1"
