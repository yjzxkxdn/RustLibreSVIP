[package]
name = "libresvip-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly build of the LibreSVIP conversion engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libresvip-core = { workspace = true }
libresvip-plugins = { workspace = true }
# No `libresvip-middlewares` here on purpose: the wasm entry only runs
# load/dump conversions, so depending on it would needlessly pull the
# `unicode-general-category` tables into the module.
