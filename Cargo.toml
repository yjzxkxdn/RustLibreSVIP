[workspace]
resolver = "2"
members = [
    "crates/libresvip-core",
    "crates/libresvip-plugins",
    "crates/libresvip-middlewares",
    "crates/libresvip-cli",
    "crates/libresvip-gui",
    "crates/libresvip-web",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/yjzxkxdn/RustLibreSVIP"

[workspace.dependencies]
libresvip-core = { path = "crates/libresvip-core" }
libresvip-plugins = { path = "crates/libresvip-plugins" }
libresvip-middlewares = { path = "crates/libresvip-middlewares" }

serde = { version = "1", features = ["derive"] }
# Both features are load-bearing (D2 evaluation):
# - `float_roundtrip`: Python parses JSON floats exactly; the fast parser can
#   be one ULP off on real-world inputs outside the golden corpus.
# - `preserve_order`: the `ds` generator (and friends) emit insertion-ordered
#   `serde_json::Value` objects to byte-match Python dict order — removing it
#   turns the keys sorted and breaks the golden suite.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
regex = "1"
encoding_rs = "0.8"
base64 = "0.22"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# `cargo build --profile wasm -p libresvip-web --target wasm32-unknown-unknown`
# Size over speed: ~25% smaller module for ~7% slower conversion.
[profile.wasm]
inherits = "release"
opt-level = "z"
